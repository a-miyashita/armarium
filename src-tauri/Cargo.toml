[package]
name = "armarium"
description = "Armarium: a desktop editor for tabular data with SQL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "../README.md"
# `cargo install armarium` builds from the files in the package, so the package must
# contain the built frontend (`dist`). `ui/` is built before `cargo publish` (release.yml).
include = [
  "/src/**",
  "/icons/**",
  "/capabilities/**",
  "/dist/**",
  "/build.rs",
  "/tauri.conf.json",
  "/Cargo.toml",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
armarium-core = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
notify = "8"

[features]
# Serves the embedded frontend (`dist`) instead of the dev server. `cargo install` does not use the
# Tauri CLI, so this feature is on by default. `tauri dev` turns it off (see README).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
