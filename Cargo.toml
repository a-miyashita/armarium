[workspace]
resolver = "2"
members = ["crates/armarium-core", "crates/armarium-mcp", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
armarium-core = { path = "crates/armarium-core" }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "session", "hooks", "functions", "cache", "column_metadata", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
ts-rs = { version = "12", features = ["serde-compat"] }
tracing = "0.1"
