name: Release

# Builds the Windows installer.
# - A push of a tag `v*` also creates a draft GitHub Release with the installers.
# - A manual run only uploads the installers as a workflow artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build installer (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Release builds use their own cache key, separate from the CI cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      - name: Build armarium-mcp
        run: cargo build --release -p armarium-mcp

      - name: Copy armarium-mcp as a sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp target/release/armarium-mcp.exe src-tauri/binaries/armarium-mcp-x86_64-pc-windows-msvc.exe

      - name: Tauri build (installer)
        run: ui/node_modules/.bin/tauri build --config src-tauri/tauri.bundle.json

      - uses: actions/upload-artifact@v4
        with:
          name: armarium-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Create a draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi
